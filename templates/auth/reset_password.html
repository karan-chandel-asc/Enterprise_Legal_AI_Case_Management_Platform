{% extends "base_auth.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h2>Set a new password</h2>
<p class="sub">Choose a strong password you haven't used before.</p>

<form id="reset-form" novalidate>
  <div class="field">
    <label for="new-password">New password</label>
    <div class="input-group">
      <input class="input" type="password" id="new-password" placeholder="Minimum 8 characters" required />
      <button type="button" class="adorn" data-toggle-password="new-password">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
  <div class="field">
    <label for="confirm-password">Confirm new password</label>
    <input class="input" type="password" id="confirm-password" placeholder="Re-enter password" required />
  </div>
  <button type="submit" class="btn btn-primary btn-lg btn-block">Reset password</button>
</form>

<div class="auth-foot"><a href="{% url 'login' %}">← Back to sign in</a></div>
{% endblock %}

{% block page_js %}
<script>
  qs("#reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const params = new URLSearchParams(window.location.search);
    const uid = params.get("uid");
    const token = params.get("token");
    if (!uid || !token) {
      toast("This reset link is invalid or has expired.", "error");
      return;
    }
    const submitBtn = e.target.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    try {
      const res = await fetch("{% url 'reset_password_api' %}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          uid,
          token,
          password: qs("#new-password").value,
          confirm_password: qs("#confirm-password").value,
        }),
      });
      const result = await res.json();
      if (!res.ok || !result.success) {
        toast(result.message || "Could not reset password", "error");
        return;
      }
      toast(result.message || "Password updated", "success");
      setTimeout(() => { window.location = "{% url 'login' %}"; }, 600);
    } catch (err) {
      toast("Something went wrong. Please try again.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
{% endblock %}
