{% extends "base_auth.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<h2>Forgot your password?</h2>
<p class="sub">Enter your work email and we'll send a link to reset your password.</p>

<form id="forgot-form" novalidate>
  <div class="field">
    <label for="fp-email">Work email</label>
    <input class="input" type="email" id="fp-email" placeholder="you@lawfirm.com" required />
  </div>
  <button type="submit" class="btn btn-primary btn-lg btn-block">Send reset link</button>
</form>

<div class="auth-foot"><a href="{% url 'login' %}">← Back to sign in</a></div>
{% endblock %}

{% block page_js %}
<script>
  qs("#forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    try {
      const res = await fetch("{% url 'forgot_password_api' %}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: qs("#fp-email").value }),
      });
      const result = await res.json();
      if (!res.ok || !result.success) {
        toast(result.message || "Something went wrong", "error");
        return;
      }
      toast(result.message || "Reset link sent — check your email", "success");
    } catch (err) {
      toast("Something went wrong. Please try again.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
{% endblock %}
